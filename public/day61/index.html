<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoodPlayer - Dynamic Music Player</title>

    <!-- Font Awesome for stylish icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- The main dynamic background element with waves -->
    <div id="dynamic-bg"></div>

    <header>
      <div id="logo">MoodPlayer</div>
      <nav>
        <a href="#player" class="nav-link active" data-page="player">Player</a>
        <a href="#settings" class="nav-link" data-page="settings"
          ><i class="fas fa-cog"></i> Settings</a
        >
        <!-- Direct link to Spotify -->
        <a href="https://www.spotify.com" target="_blank" class="nav-link"
          ><i class="fab fa-spotify"></i> Spotify</a
        >
      </nav>
    </header>

    <!-- Content Wrapper for positioning components in free design -->
    <div id="content-wrapper">
      <!-- Player Page Content -->
      <div id="player-page" class="page-content active">
        <main>
          <h1 id="current-mood-text">Current Mood: Select One</h1>

          <!-- Mood Selector Buttons (8 Moods with Emojis) -->
          <div id="mood-selector">
            <button data-mood="happy">😊</button>
            <button data-mood="sad">😢</button>
            <button data-mood="energetic">⚡</button>
            <button data-mood="relaxed">😌</button>
            <button data-mood="angry">😡</button>
            <button data-mood="tired">😴</button>
            <button data-mood="neutral">😐</button>
          </div>

          <!-- Secondary Controls (Shuffle, Theme) -->
          <div id="optional-controls">
            <button id="random-mood">
              <i class="fas fa-random"></i> Shuffle Mood
            </button>
            <button id="theme-toggle">
              <i class="fas fa-moon"></i> Dark Mode
            </button>
          </div>

          <!-- Music Player Area -->
          <div id="music-player">
            <h2>Now Playing: <span id="song-title">Song Title</span></h2>
            <!-- <audio id="audio-source" src="" preload="auto"></audio> -->
            <iframe
              data-testid="embed-iframe"
              style="border-radius: 12px"
              src=""
              width="100%"
              height="200"
              frameborder="0"
              allowfullscreen=""
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"
              id="audio-source"
            ></iframe>

            <!-- Inside <div id="music-player"> -->
            <div id="audio-controls-box">
              <!-- 1. Playback Controls Box (Play, Forward, Backward, Track Bar) -->
              <div id="track-controls">
                <button id="backward-track">
                  <i class="fas fa-step-backward"></i>
                </button>
                <!-- <button id="play-pause"><i class="fas fa-play"></i></button> -->
                <button id="forward-track">
                  <i class="fas fa-step-forward"></i>
                </button>

               
              </div>
            </div>

            <div id="playlist">
              <!-- Playlist songs will be injected by JavaScript -->
            </div>
          </div>
        </main>
      </div>

      <!-- Settings Page Content -->
      <div id="settings-page" class="page-content">
        <h1 class="settings-header">Please Log In To Spotify!</h1>
        <p>
          Access to advanced settings and personalized playlists requires
          Spotify authentication.
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
